version: '3.8'

services:
  # 1. MySQL 8.0 para customer-service
  mysql:
    image: mysql:8.0
    container_name: fluffy-yarn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:?falta DB_PASSWORD, ejecuta cp .env.example .env}'
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fluffy_yarn_db}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: '${DB_PASSWORD:?falta DB_PASSWORD, ejecuta cp .env.example .env}'
    ports:
      - "3306:3306"
    volumes:
      - fluffy_yarn_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 6. Config Server: centraliza la config de auth/customer (perfil native + ./config-repo)
  config-server:
    build: ./config-server
    container_name: fluffy-yarn-config
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      CONFIG_REPO_PATH: /app/config-repo
    volumes:
      - ./config-repo:/app/config-repo:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20

  # 2. PostgreSQL 15 para auth-service
  postgres:
    image: postgres:15-alpine
    container_name: fluffy-yarn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${DB_PASSWORD:?falta DB_PASSWORD, ejecuta cp .env.example .env}'
    ports:
      - "5432:5432"
    volumes:
      - fluffy_yarn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Redis para block list de tokens (logout)
  redis:
    image: redis:7-alpine
    container_name: fluffy-yarn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - fluffy_yarn_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 4. auth-service (PostgreSQL + Redis)
  auth-service:
    build: ./auth-service
    container_name: fluffy-yarn-auth
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: postgres
      DB_PASSWORD: '${DB_PASSWORD:?falta DB_PASSWORD, ejecuta cp .env.example .env}'
      JWT_SECRET: '${JWT_SECRET:?falta JWT_SECRET, ejecuta cp .env.example .env}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:?falta ADMIN_PASSWORD, ejecuta cp .env.example .env}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # 5. customer-service (MySQL + Redis)
  customer-service:
    build: ./customer-service
    container_name: fluffy-yarn-customer
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fluffy_yarn_customer_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/fluffy_yarn_customer_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: '${DB_PASSWORD:?falta DB_PASSWORD, ejecuta cp .env.example .env}'
      JWT_SECRET: '${JWT_SECRET:?falta JWT_SECRET, ejecuta cp .env.example .env}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # 6. commercial-service (MySQL + Redis)
  commercial-service:
    build: ./commercial-service
    container_name: fluffy-yarn-commercial
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fluffy_yarn_commercial_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/fluffy_yarn_commercial_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: '${DB_PASSWORD:?falta DB_PASSWORD, ejecuta cp .env.example .env}'
      JWT_SECRET: '${JWT_SECRET:?falta JWT_SECRET, ejecuta cp .env.example .env}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy

volumes:
  fluffy_yarn_data:
  fluffy_yarn_postgres_data:
  fluffy_yarn_redis_data:
