version: '3.8'

services:
  # 1. Base de datos MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: fluffy-yarn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:?falta DB_PASSWORD, ejecuta cp .env.example .env}'
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fluffy_yarn_db}
    ports:
      - "3306:3306"
    volumes:
      - fluffy_yarn_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Aplicación Backend Spring Boot
  app:
    build: .
    container_name: fluffy-yarn-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fluffy_yarn_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: '${DB_PASSWORD:?falta DB_PASSWORD, ejecuta cp .env.example .env}'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  fluffy_yarn_data: