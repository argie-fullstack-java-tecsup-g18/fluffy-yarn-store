# Nombre de la Aplicación
spring.application.name=auth-service

# Importa el archivo .env como si fuera un properties.
# Requerido porque Spring Boot no lee archivos .env de forma nativa.
# "optional:" hace que no falle si el archivo no existe (dentro del contenedor Docker).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:configserver:http://config-server:8888

# Perfil por defecto dev; SPRING_PROFILES_ACTIVE lo cambia (ej. prod). Antes vivia
# en bootstrap.yml (eliminado por deprecado), decide que archivo pide al Config Server:
# dev -> auth-service-dev.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Clave de firma de los tokens JWT.
# Sin valor por defecto a propósito: si faltara, Spring usaría el literal
# "${JWT_SECRET}" como clave, que son 13 bytes y HmacSHA256 los rechaza, así que
# la app fallaría al arrancar con un error poco descriptivo en vez de señalar
# que falta la variable.
jwt.secret=${JWT_SECRET}

# Configuración de PostgreSQL para el Auth Service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Configuración de Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Configuración de Hibernate / JPA para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Deshabilita Open Session in View. Spring mantiene la sesión de JPA abierta durante
# toda la petición HTTP, lo que dispara queries implícitas (LazyLoading) en el
# controlador y puede provocar N+1. El ciclo transaccional debe ser explícito.
# Relevante al ser una API REST: no view renders.
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgres

# Red de seguridad para los errores: sin esto, cualquier excepción que el
# GlobalExceptionHandler no mapee cae en /error y el JSON trae el stack trace
# completo (path de los archivos, version de Hibernate) y el mensaje de la
# excepción con el SQL y los nombres de constraint adentro.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# Usuario admin inicial con el que el cliente gestiona la tienda.
# El password NO tiene valor por defecto a propósito: sale solo de .env, igual que
# JWT_SECRET y DB_PASSWORD. Si falta la variable, Spring no resuelve el placeholder y
# la app no arranca en vez de quedarse con una credencial escrita en el repo.
# El username si tiene default: es público y no protege nada.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}