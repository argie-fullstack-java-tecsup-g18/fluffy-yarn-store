spring.application.name=config-server
server.port=8888

# "native" backend: lee archivos planos desde una carpeta. Git es la variante en producción (spring.cloud.config.server.git.uri).
spring.profiles.active=native

# Ruta relativa a la carpeta desde donde arranca el servidor (config-server/). Se puede sobrescribir con CONFIG_REPO_PATH al lanzar desde otro lado.
spring.cloud.config.server.native.search-locations=file:${CONFIG_REPO_PATH:../config-repo}