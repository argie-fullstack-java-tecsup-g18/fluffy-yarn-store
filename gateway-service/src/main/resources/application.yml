spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8080
          predicates:
            - Path=/auth/**
        - id: customer-service
          uri: http://customer-service:8080
          predicates:
            - Path=/customers/**

server:
  port: 8080