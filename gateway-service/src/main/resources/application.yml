spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service:8080
              predicates:
                - Path=/auth/**,/users/**,/roles/**
            - id: customer-service
              uri: http://customer-service:8080
              predicates:
                - Path=/customers/**
            - id: commercial-service
              uri: http://commercial-service:8080
              predicates:
                - Path=/products/**

server:
  port: 8080