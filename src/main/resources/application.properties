# Nombre de la Aplicación
spring.application.name=fluffy-yarn-store

# Importa el archivo .env como si fuera un properties.
# Requerido porque Spring Boot no lee archivos .env de forma nativa.
# "optional:" hace que no falle si el archivo no existe (dentro del contenedor Docker).
spring.config.import=optional:file:.env[.properties]

# Clave de firma de los tokens JWT.
# Sin valor por defecto a propósito: si faltara, Spring usaría el literal
# "${JWT_SECRET}" como clave, que son 13 bytes y HmacSHA256 los rechaza, así que
# la app fallaría al arrancar con un error poco descriptivo en vez de señalar
# que falta la variable.
jwt.secret=${JWT_SECRET}

# Configuración de Conexión a MySQL
# La contraseña NO tiene valor por defecto: sale de .env (ver README)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fluffy_yarn_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
# validate y no update: el esquema lo crea Flyway, Hibernate solo comprueba que las
# tablas, columnas y tipos coincidan con lo que esperan las entidades. Si no coinciden,
# no arranca, que es el comportamiento que queremos en vez de que Hibernate reesquema
# la base por su cuenta.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Deshabilita Open Session in View. Spring mantiene la sesión de JPA abierta durante
# toda la petición HTTP, lo que dispara queries implícitas (LazyLoading) en el
# controlador y puede provocar N+1. El ciclo transaccional debe ser explícito.
# Relevante al ser una API REST: no view renders.
spring.jpa.open-in-view=false

# Flyway es el dueño del esquema: crea las tablas y siembra los roles.
# Corre antes que cualquier ApplicationRunner, por eso cuando el InitialAdminSeeder
# busca RoleName.ADMIN los cuatro roles ya existen.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Usuario admin inicial con el que el cliente gestiona la tienda.
# El password NO tiene valor por defecto a propósito: sale solo de .env, igual que
# JWT_SECRET y DB_PASSWORD. Si falta la variable, Spring no resuelve el placeholder y
# la app no arranca en vez de quedarse con una credencial escrita en el repo.
# El username si tiene default: es publico y no protege nada.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}