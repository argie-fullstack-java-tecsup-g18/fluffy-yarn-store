# Perfil de desarrollo. Se activa con --spring.profiles.active=dev o
# SPRING_PROFILES_ACTIVE=dev.
#
# Todo lo que es ruidoso o sensible va aca y no en el application.properties base,
# que es el que corre en produccion y dentro de Docker.

# Imprime cada SQL. En el INSERT de usuarios trae el hash BCrypt completo, por eso
# no puede estar activo fuera de desarrollo.
spring.jpa.show-sql=true
