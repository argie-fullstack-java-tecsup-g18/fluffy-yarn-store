# Shared by every profile of auth-service. NO secrets here: JWT_SECRET, DB_USER and DB_PASSWORD come from the environment of each service.
server.port=8081
spring.datasource.hikari.connection-timeout=30000
logging.level.root=INFO
logging.pattern.console=%d{yyyy/MM/dd HH:mm:ss} %-5level [%class{0}] - %msg%n
# Vida del token JWT en minutos. La lee TokenGeneratorService (@Value) y el login
# la expone como expiresIn (segundos). Default en codigo: 60.
#
# ── TOGGLE DEMO / DEBUG ────────────────────────────────────────────────────────
# Solo activa UNA de las dos lineas siguientes.
# Normal (sin demo): 60 activo, 1 comentado.
# Demo/depuracion (token vive 1 min): comenta la de 60 y descomenta la de 1,
# luego: podman-compose restart auth-service
# (no hace falta rebuild; los tokens ya emitidos conservan su exp original).
app.jwt.expiration-minutes=60
#  app.jwt.expiration-minutes=1
# ───────────────────────────────────────────────────────────────────────────────