# Shared by every profile of commercial-service. NO secrets here.
server.port=8083
# URL del auth-service para el Feign client (AuthClient).
# En Docker la resuelve el servicio auth-service; en localhost usa el puerto mapeado.
store.auth-service.url=http://localhost:8081

logging.level.root=INFO
logging.pattern.console=%d{yyyy/MM/dd HH:mm:ss} %-5level [%class{0}] - %msg%n
