# Nombre de la Aplicación
spring.application.name=customer-service

# Importa el archivo .env como si fuera un properties.
# Requerido porque Spring Boot no lee archivos .env de forma nativa.
# "optional:" hace que no falle si el archivo no existe (dentro del contenedor Docker).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:configserver:http://config-server:8888

# Perfil por defecto dev; SPRING_PROFILES_ACTIVE lo cambia (ej. prod). Antes vivia
# en bootstrap.yml (eliminado por deprecado), decide que archivo pide al Config Server:
# dev -> customer-service-dev.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# Configuración de Conexión a MySQL
# La contraseña NO tiene valor por defecto: sale de .env (ver README)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fluffy_yarn_customer_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Configuración de JPA / Hibernate
# validate y no update: el esquema lo crea Flyway, Hibernate solo comprueba que las
# tablas, columnas y tipos coincidan con lo que esperan las entidades. Si no coinciden,
# no arranca, que es el comportamiento que queremos en vez de que Hibernate reesquema
# la base por su cuenta.
spring.jpa.hibernate.ddl-auto=validate
# show-sql vive en application-dev.properties. Con true en produccion, cada INSERT de
# usuario imprime el hash BCrypt completo en el log, que es un dato sensible que no
# deberia estar en un archivo de log ni en stdout de un contenedor.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Deshabilita Open Session in View. Spring mantiene la sesión de JPA abierta durante
# toda la petición HTTP, lo que dispara queries implícitas (LazyLoading) en el
# controlador y puede provocar N+1. El ciclo transaccional debe ser explícito.
# Relevante al ser una API REST: no view renders.
spring.jpa.open-in-view=false

# Flyway es el dueño del esquema: crea las tablas y siembra los roles.
# Corre antes que cualquier ApplicationRunner, por eso cuando el InitialAdminSeeder
# busca RoleName.ADMIN los cuatro roles ya existen.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Red de seguridad para los errores: sin esto, cualquier excepcion que el
# GlobalExceptionHandler no mapee cae en /error y el JSON trae el stack trace
# completo (path de los archivos, version de Hibernate) y el mensaje de la
# excepcion con el SQL y los nombres de constraint adentro.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never